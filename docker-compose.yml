services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env            # API_KEYS=..., see .env.example
    volumes:
      - ./models:/models      # weights are downloaded here on the first start
      - ./storage:/data       # job results
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
